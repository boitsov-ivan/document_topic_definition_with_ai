# telegram-bot.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-bot
  namespace: document-analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegram-bot
  template:
    metadata:
      labels:
        app: telegram-bot
    spec:
      containers:
      - name: bot
        image: k8s-registry/telegram-bot:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: app-secrets
        - configMapRef:
            name: app-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"