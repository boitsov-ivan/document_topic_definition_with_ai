# ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: document-analyzer
spec:
  rules:
  - host: document-analyzer.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: streamlit
            port:
              number: 8501
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: search-gateway
            port:
              number: 8002